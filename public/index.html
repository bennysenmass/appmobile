<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Cuenta — Mensajería</title>
<link rel="manifest" href="/manifest-client.json">
<meta name="theme-color" content="#1F7A5C">
<link rel="apple-touch-icon" href="/icons/client-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Cuenta">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#12211E;--ink-soft:#3C4A47;--paper:#F2F4F1;--card:#FFFFFF;--line:#D7DCD3;--money:#1F7A5C;--money-soft:#E4F1EB;--warn:#C4562B;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;height:100vh;display:flex;align-items:center;justify-content:center;}
  .app{width:100%;max-width:420px;height:100vh;max-height:720px;background:var(--card);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 32px rgba(18,33,30,.08);}
  @media(min-width:460px){.app{border-radius:20px;border:1px solid var(--line);margin:20px;}}

  .login{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 28px;gap:14px;}
  .login h1{font-size:19px;margin:0;}
  .login p{font-size:13px;color:var(--ink-soft);margin:0 0 10px;}
  .login input{border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-family:inherit;font-size:14px;background:var(--paper);}
  .login button{margin-top:6px;border:none;background:var(--money);color:#fff;padding:13px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
  .err{font-size:12px;color:var(--warn);min-height:14px;}

  .head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--money-soft);color:var(--money);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;}
  .head .name{font-size:14px;font-weight:600;}
  .head .status{font-size:11px;color:var(--money);}
  .logout{margin-left:auto;background:none;border:none;font-size:11px;color:var(--ink-soft);cursor:pointer;font-family:inherit;}

  .chat{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--paper);}
  .bubble{max-width:78%;padding:9px 12px;border-radius:14px;font-size:13.5px;line-height:1.4;white-space:pre-wrap;}
  .bubble.mine{align-self:flex-end;background:var(--money);color:#fff;border-bottom-right-radius:4px;}
  .bubble.theirs{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px;}
  .bubble .time{display:block;font-size:10px;opacity:.65;margin-top:3px;}
  .empty{margin:auto;text-align:center;font-size:12.5px;color:var(--ink-soft);}

  .composer{border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;align-items:center;}
  .composer input[type=text]{flex:1;border:1px solid var(--line);border-radius:999px;padding:11px 15px;font-family:inherit;font-size:13.5px;background:var(--paper);}
  .composer button{border:none;background:var(--money);color:#fff;width:40px;height:40px;border-radius:50%;font-size:16px;cursor:pointer;flex-shrink:0;}
  .composer button.clip{background:none;color:var(--ink-soft);font-size:19px;width:32px;height:32px;}

  .install-banner{
    position:fixed;top:0;left:0;right:0;z-index:50;
    background:var(--ink);color:#fff;
    padding:12px 14px;display:flex;align-items:center;gap:10px;
    font-size:12.5px;line-height:1.35;
    box-shadow:0 4px 16px rgba(0,0,0,.15);
  }
  .install-banner span{flex:1;}
  .install-banner button{font-family:inherit;border:none;cursor:pointer;}
  .install-banner #installBtn{background:var(--money);color:#fff;font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:8px;flex-shrink:0;}
  .install-banner #installDismiss{background:none;color:#cfd6d2;font-size:14px;padding:4px;flex-shrink:0;}
  .preview{border-top:1px solid var(--line);padding:8px 14px;display:flex;align-items:center;gap:8px;background:var(--card);font-size:12px;color:var(--ink-soft);}
  .preview img{width:34px;height:34px;object-fit:cover;border-radius:6px;}
  .preview .pname{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .preview .pcancel{cursor:pointer;color:var(--warn);font-weight:600;background:none;border:none;font-family:inherit;font-size:12px;}
  .bubble img.att{max-width:100%;border-radius:10px;display:block;margin-bottom:4px;}
  .bubble a.filechip{display:flex;align-items:center;gap:6px;text-decoration:none;color:inherit;background:rgba(255,255,255,.15);border-radius:8px;padding:6px 8px;margin-bottom:4px;font-size:12.5px;}
  .bubble.theirs a.filechip{background:var(--paper);}

  .quickbar{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px 0;background:var(--paper);}
  .quickchip{border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-size:12px;font-weight:500;padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;}
  .quickchip:active{background:var(--money-soft);border-color:var(--money);}
</style>
</head>
<body>
<div class="install-banner" id="installBanner" style="display:none;">
  <span id="installText">Instalá la app para un acceso más rápido</span>
  <button id="installBtn">Instalar</button>
  <button id="installDismiss" aria-label="Cerrar">✕</button>
</div>
<div class="app">
  <div class="login" id="loginView">
    <h1>Ingresá a tu cuenta</h1>
    <p>Usá tu usuario y clave.</p>
    <input type="text" id="user" placeholder="Usuario" autocomplete="username">
    <input type="password" id="pass" placeholder="Clave" autocomplete="current-password">
    <p class="err" id="err"></p>
    <button id="loginBtn">Ingresar</button>
  </div>

  <div id="chatWrap" style="display:none;flex-direction:column;flex:1;overflow:hidden;">
    <div class="head">
      <div class="avatar">AT</div>
      <div><div class="name">Atención</div><div class="status">En línea</div></div>
      <button class="logout" id="logoutBtn">Salir</button>
    </div>
    <div class="chat" id="chatScroll"></div>
    <div class="quickbar" id="quickBar"></div>
    <div class="preview" id="filePreview" style="display:none;"></div>
    <div class="composer">
      <button id="clipBtn" class="clip" type="button" title="Adjuntar archivo">📎</button>
      <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp,image/gif,application/pdf" style="display:none;">
      <input type="text" id="msgInput" placeholder="Escribí un mensaje...">
      <button id="sendBtn">➤</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/push-client.js"></script>
<script>
let token = null;
let socket = null;

function fmtTime(iso){
  return new Date(iso).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

document.getElementById('loginBtn').addEventListener('click', async ()=>{
  const username = document.getElementById('user').value.trim();
  const password = document.getElementById('pass').value.trim();
  const errEl = document.getElementById('err');
  errEl.textContent = '';
  if(!username || !password){ errEl.textContent = 'Completá usuario y clave.'; return; }

  try{
    const res = await fetch('/api/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if(!res.ok){ errEl.textContent = data.error || 'Error al ingresar'; return; }
    token = data.token;
    startChat();
  }catch(e){
    errEl.textContent = 'No se pudo conectar con el servidor.';
  }
});

async function startChat(){
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('chatWrap').style.display = 'flex';

  const res = await fetch('/api/messages/me', { headers:{ Authorization: 'Bearer ' + token } });
  const history = await res.json();
  renderMessages(history);
  renderQuickBar();

  socket = io({ auth: { token } });
  socket.on('new_message', (m)=>{
    appendMessage(m);
  });

  setupPushNotifications(token);
}

// ---- menú de opciones rápidas ----
const QUICK_OPTIONS = [
  'Quiero cargar',
  'Quiero hacer un retiro',
  'Me pasás los datos de mi cuenta',
  'Acceder a la plataforma'
];

function renderQuickBar(){
  const bar = document.getElementById('quickBar');
  bar.innerHTML = QUICK_OPTIONS.map(label =>
    `<button class="quickchip" data-label="${escapeHtml(label)}">${escapeHtml(label)}</button>`
  ).join('');
  bar.querySelectorAll('.quickchip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(!socket) return;
      socket.emit('send_message', { text: btn.dataset.label });
    });
  });
}

function renderMessages(list){
  const wrap = document.getElementById('chatScroll');
  wrap.innerHTML = list.length ? '' : '<div class="empty">Todavía no escribiste nada. Mandá un mensaje para empezar.</div>';
  list.forEach(m => appendMessage(m, false));
  wrap.scrollTop = wrap.scrollHeight;
}

function bubbleAttachmentHtml(m){
  if(!m.file_url) return '';
  if((m.file_mime||'').startsWith('image/')){
    return `<a href="${m.file_url}" target="_blank"><img class="att" src="${m.file_url}" alt="${escapeHtml(m.file_name||'imagen')}"></a>`;
  }
  return `<a class="filechip" href="${m.file_url}" target="_blank">📄 ${escapeHtml(m.file_name||'archivo')}</a>`;
}

function appendMessage(m, scroll = true){
  const wrap = document.getElementById('chatScroll');
  const empty = wrap.querySelector('.empty');
  if(empty) empty.remove();
  const div = document.createElement('div');
  div.className = 'bubble ' + (m.sender_role === 'client' ? 'mine' : 'theirs');
  const textHtml = m.text ? escapeHtml(m.text) : '';
  div.innerHTML = bubbleAttachmentHtml(m) + textHtml + '<span class="time">' + fmtTime(m.created_at) + '</span>';
  wrap.appendChild(div);
  if(scroll) wrap.scrollTop = wrap.scrollHeight;
}

// ---- adjuntar archivo ----
let selectedFile = null;

document.getElementById('clipBtn').addEventListener('click', ()=>{
  document.getElementById('fileInput').click();
});
document.getElementById('fileInput').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  if(file.size > 8 * 1024 * 1024){ alert('El archivo no puede superar 8 MB.'); e.target.value=''; return; }
  selectedFile = file;
  const prev = document.getElementById('filePreview');
  prev.style.display = 'flex';
  prev.innerHTML = (file.type.startsWith('image/') ? `<img src="${URL.createObjectURL(file)}">` : '📄') +
    `<span class="pname">${escapeHtml(file.name)}</span><button class="pcancel" id="pcancel">Quitar</button>`;
  document.getElementById('pcancel').addEventListener('click', ()=>{
    selectedFile = null;
    document.getElementById('fileInput').value = '';
    prev.style.display = 'none';
  });
});

async function uploadSelectedFile(){
  const fd = new FormData();
  fd.append('file', selectedFile);
  const res = await fetch('/api/upload', {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + token },
    body: fd
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data.error || 'No se pudo subir el archivo');
  return data;
}

document.getElementById('sendBtn').addEventListener('click', sendMsg);
document.getElementById('msgInput').addEventListener('keydown', e=>{ if(e.key==='Enter') sendMsg(); });
async function sendMsg(){
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if((!text && !selectedFile) || !socket) return;

  let attachment = null;
  const sendBtn = document.getElementById('sendBtn');
  try{
    if(selectedFile){
      sendBtn.disabled = true; sendBtn.textContent = '…';
      attachment = await uploadSelectedFile();
    }
  }catch(err){
    alert(err.message);
    sendBtn.disabled = false; sendBtn.textContent = '➤';
    return;
  }

  socket.emit('send_message', { text, attachment });
  input.value = '';
  selectedFile = null;
  document.getElementById('fileInput').value = '';
  document.getElementById('filePreview').style.display = 'none';
  sendBtn.disabled = false; sendBtn.textContent = '➤';
}

document.getElementById('logoutBtn').addEventListener('click', ()=>{
  if(socket) socket.disconnect();
  token = null;
  document.getElementById('chatWrap').style.display = 'none';
  document.getElementById('loginView').style.display = 'flex';
  document.getElementById('pass').value = '';
});

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  });
}

// ---- cartel de instalación ----
(function initInstallBanner(){
  const banner = document.getElementById('installBanner');
  const textEl = document.getElementById('installText');
  const installBtn = document.getElementById('installBtn');
  const dismissBtn = document.getElementById('installDismiss');
  let deferredPrompt = null;

  function isStandalone(){
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  }
  function wasDismissed(){
    try{ return localStorage.getItem('installBannerDismissed') === '1'; }catch{ return false; }
  }
  function dismiss(){
    banner.style.display = 'none';
    try{ localStorage.setItem('installBannerDismissed', '1'); }catch{}
  }

  if(isStandalone() || wasDismissed()) return;

  const ua = window.navigator.userAgent.toLowerCase();
  const isIos = /iphone|ipad|ipod/.test(ua);

  if(isIos){
    textEl.textContent = 'Para instalar la app: tocá compartir 􀈂 y elegí "Agregar a pantalla de inicio"';
    installBtn.style.display = 'none';
    banner.style.display = 'flex';
  }else{
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      banner.style.display = 'flex';
    });
    installBtn.addEventListener('click', async ()=>{
      banner.style.display = 'none';
      if(deferredPrompt){
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
      }
    });
  }

  dismissBtn.addEventListener('click', dismiss);
  window.addEventListener('appinstalled', ()=>{ banner.style.display = 'none'; deferredPrompt = null; });
})();
</script>
</body>
</html>
